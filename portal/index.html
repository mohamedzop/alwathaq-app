<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الوثاق | دخول الموظفين</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c2e2f">
<style>@import url('https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Cairo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');</style>
<link rel="stylesheet" href="portal.css">
<link rel="icon" href="../site/assets/favicon.svg" type="image/svg+xml">
</head>
<body>

<!-- ═══════════ شاشة تسجيل الدخول ═══════════ -->
<div id="login-view" class="login-view">
  <div class="login-card">
    <div class="login-brand">
      <svg class="ring-mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="24" cy="32" r="13" fill="none" stroke="url(#gold)" stroke-width="5"/>
        <circle cx="40" cy="32" r="13" fill="none" stroke="url(#gold)" stroke-width="5"/>
        <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e6c878"/><stop offset=".5" stop-color="#c9a54f"/><stop offset="1" stop-color="#a8812f"/>
        </linearGradient></defs>
      </svg>
      <h1>الوثاق للصرافة</h1>
      <p>بوابة الموظفين — تسجيل الدخول</p>
    </div>
    <form id="login-form" autocomplete="off">
      <label>اسم المستخدم
        <input type="text" id="login-user" name="username" required autofocus autocomplete="username">
      </label>
      <label>كلمة المرور
        <input type="password" id="login-pass" name="password" required autocomplete="current-password">
      </label>
      <p id="login-error" class="form-error hidden"></p>
      <button type="submit" class="btn-gold" id="login-btn">دخول</button>
    </form>
    <p class="login-note">بوابة داخلية لموظفي ومديري الوثاق للصرافة فقط.<br>حسابات البداية تظهر في نافذة الخادم عند أول تشغيل — غيّرها من صفحة «المستخدمون».</p>
  </div>
  <div class="login-bg" aria-hidden="true"></div>
</div>

<!-- ═══════════ واجهة التطبيق ═══════════ -->
<div id="app-view" class="app-view hidden">
  <aside class="side">
    <div class="side-brand">
      <svg class="ring-mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="24" cy="32" r="13" fill="none" stroke="#c9a54f" stroke-width="5"/>
        <circle cx="40" cy="32" r="13" fill="none" stroke="#c9a54f" stroke-width="5"/>
      </svg>
      <div><b>الوثاق للصرافة</b><span>البوابة الداخلية</span></div>
    </div>
    <nav class="side-nav">
      <button class="nav-item active" data-view="dashboard"><span class="ni">📊</span> لوحة اليوم</button>
      <button class="nav-item" data-view="transactions"><span class="ni">🧾</span> المعاملات</button>
      <button class="nav-item" data-view="clients"><span class="ni">👥</span> العملاء</button>
      <button class="nav-item manager-only" data-view="reports"><span class="ni">📈</span> التقارير</button>
      <button class="nav-item manager-only" data-view="settlement"><span class="ni">🧮</span> إقفال اليوم</button>
      <button class="nav-item" data-view="rates"><span class="ni">💱</span> الأسعار</button>
      <button class="nav-item manager-only" data-view="users"><span class="ni">🔐</span> المستخدمون</button>
    </nav>
    <div class="side-foot">
      <button id="logout-btn" class="logout-btn">تسجيل الخروج ↪</button>
      <small>v1.0 — للاستخدام الداخلي</small>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="page-title">لوحة اليوم</h2>
      <div class="topbar-left">
        <div class="user-chip" id="user-chip"></div>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<!-- ═══════════ فاتورة الزبون ═══════════ -->
<div id="receipt-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3>فاتورة العملية</h3>
      <button id="receipt-close" class="btn-ghost" type="button">✕ إغلاق</button>
    </div>
    <div id="receipt-preview" class="receipt-scroll"></div>
    <div class="modal-actions">
      <button id="receipt-print" class="btn-gold" type="button">🖨️ طباعة الفاتورة</button>
    </div>
  </div>
</div>
<div id="receipt-print" class="print-area"></div>

<div id="toast-wrap" class="toast-wrap"></div>

<script src="app.js"></script>
</body>
</html>
